[project]
name = "filadeep"
version = "0.1.0"
description = "Modify painted multi-color 3MF files for better color prints"
readme = "README.md"
authors = [
    { name = "Marcin Zukowski", email = "marcin.zukowski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "manifold3d>=3.5.4",
    "numpy>=2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project.scripts]
filadeep = "filadeep.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
