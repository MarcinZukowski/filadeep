<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerFun</title>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header>
  <h1>LayerFun</h1>
  <span class="sub" data-tip="Takes a color-painted Bambu Studio / OrcaSlicer project and turns the paint into real solid parts, so each color has a controlled thickness. Optionally adds a core, a primer layer and an outer shell.">painted 3MF → solid color layers, core, primer, shell</span>
  <span class="grow"></span>
  <button id="copyLink" data-tip="Copy a link that reopens this page with the same model URL and all options. A model opened from a local file can't be included, only the options.">Copy link</button>
</header>

<main>
  <section class="panel" id="left">
    <div class="controls">
      <h2 data-tip="The painted model you start from, shown with its paint.">Source</h2>
      <div class="row">
        <label class="file" data-tip="Open a .3mf from your computer (or drop one anywhere on the page). It stays in your browser; nothing is uploaded.">Open file…<input id="srcFile" type="file" accept=".3mf"></label>
        <button id="openUrl" data-tip="Load a .3mf from a web address. The server must allow cross-site downloads (CORS): raw GitHub links work, most model sites don't, so download those and use Open file. A model loaded this way is included in Copy link.">Open URL…</button>
        <span class="hint demos">Demos:
          <a href="#src=models/testshapes.3mf" data-tip="Cube, pyramid and sphere with thin and thick painted details.">testshapes</a> ·
          <a href="#src=models/penguin.3mf&core=3&primer=4" data-tip="A penguin: black pupils on white, thin yellow eyebrows on black, a white belly. Loads with a black core and white primer selected.">penguin</a></span>
      </div>
      <div id="srcInfo" class="info" data-tip="Objects, triangle count, how many triangles carry paint, the slicer that saved the file, and its number of filament slots."></div>
      <div id="srcLegend" class="legend"></div>
    </div>
    <div class="view" data-tip="Drag to rotate, right-drag to pan, scroll to zoom. Both views move together." data-tip-view><canvas id="cvSrc"></canvas><div class="tag">source</div></div>
  </section>

  <section class="panel" id="right">
    <div class="controls">
      <h2 data-tip="What LayerFun will generate. Pick options, press RUN, then Save 3MF and open it in your slicer.">Output</h2>
      <div class="grid">
        <fieldset>
          <legend data-tip="How deep each painted color goes into the model. Dark colors cover well, so they stay shallow (no bleeding through light colors next to them); light colors are translucent and need more thickness to hide what's behind them. In between, depth follows the color's brightness.">Color depth</legend>
          <label data-tip="Depth for the darkest colors (black). Other colors get a depth between this and the white value, by brightness.">black <input id="dmin" type="number" step="0.05" min="0.1" value="0.45"> mm</label>
          <label data-tip="Depth for the lightest colors (white).">white <input id="dmax" type="number" step="0.05" min="0.1" value="1.6"> mm</label>
          <label data-tip="Set the depth of specific filaments directly, as slot=mm pairs, e.g. 3=0.4,1=1.5. Wins over the black/white rule.">overrides <input id="depths" type="text" placeholder="3=0.4,1=1.5" size="10"></label>
        </fieldset>
        <fieldset>
          <legend data-tip="Fill the inside with a separate filament (e.g. strong or cheap PLA-CF) and keep the paint as a skin of fixed thickness around it."><label><input id="coreOn" type="checkbox"> Core (#1)</label></legend>
          <label data-tip="Filament slot for the inside. Where the paint already uses this filament, skin and core simply merge.">filament <select id="coreF" class="fil"></select></label>
          <label data-tip="Thickness of the colored skin over the core, the same for every color (per-filament overrides from Color depth still apply).">skin <input id="skin" type="number" step="0.1" min="0.2" value="1.2"> mm</label>
          <label data-tip="Add a layer between the colors and the core, e.g. white over a black core so light colors stay bright. Not placed where the core filament itself shows on the surface."><input id="primerOn" type="checkbox"> primer <select id="primerF" class="fil"></select></label>
          <label data-tip="Thickness of the primer layer.">primer <input id="pt" type="number" step="0.1" min="0.2" value="0.8"> mm</label>
        </fieldset>
        <fieldset>
          <legend data-tip="Wrap the whole model in a thin layer of another filament, e.g. clear PVB to smooth with alcohol. The paint is turned into solid parts first, because slicers ignore paint that is no longer on the outside."><label><input id="shellOn" type="checkbox"> Shell (#3)</label></legend>
          <label data-tip="Filament slot for the shell. Use a transparent or translucent one, or the colors won't be visible.">filament <select id="shellF" class="fil"></select></label>
          <label data-tip="Shell thickness. The model grows by this much on every side.">thickness <input id="st" type="number" step="0.1" min="0.2" value="1.0"> mm</label>
          <label data-tip="Off: the shell is cut flat at the model's base, so the print sits on the bed as before. On: the bottom gets a shell too (raises the model)."><input id="kb" type="checkbox"> also cover bottom</label>
        </fieldset>
        <fieldset>
          <legend data-tip="Settings you normally don't need to touch.">Advanced</legend>
          <label data-tip="Grid resolution for computing the hidden boundaries between colors. Smaller is more precise but slower and uses more memory (half the size is about 4-8x the work). The visible outer surface is always kept exactly.">voxel <input id="voxel" type="number" step="0.05" min="0.1" value="0.25"> mm</label>
          <div id="estimate" class="estimate" data-tip="Rough estimate of run time and peak memory for these options, from the painted surface area and the voxel size (calibrated on an Apple M4 Max; slower machines take 2-3x longer). Browsers allow a WebAssembly page about 4 GB."></div>
          <label data-tip="Only process objects whose name contains this text. Empty: all painted objects (or all objects when nothing is painted).">objects <input id="obj" type="text" placeholder="name filter" size="10"></label>
        </fieldset>
      </div>
      <div class="row">
        <button id="run" class="primary" disabled data-tip="Generate the output with the current options. Runs in the background; the page stays usable.">RUN</button>
        <button id="cancel" hidden data-tip="Stop the current run.">Cancel</button>
        <button id="save" disabled data-tip="Download the generated .3mf. It keeps all slicer settings of the original project; open it in Bambu Studio / OrcaSlicer.">Save 3MF</button>
        <button id="logBtn" class="right" data-tip="Show or hide the detailed log of the last run: steps, timings, triangle counts and volumes.">Log</button>
      </div>
      <!-- Always-present line: progress bar while running, status text otherwise (no layout jump). -->
      <div id="progress" class="progress" data-tip="Status of the last action. While running: progress, current step, elapsed time and an estimate of the time left (some steps can't report progress, so the bar jumps at those)."><div class="fill"></div><span class="ptext"></span><span id="status" class="status"></span></div>
      <div id="outLegend" class="legend"></div>
    </div>
    <div class="view" data-tip="The generated parts in their filament colors. Use the chips above to hide filaments (e.g. the shell) and the layer slider to see cross-sections." data-tip-view><canvas id="cvOut"></canvas><div class="tag">output</div>
      <div id="logPanel" class="logpanel" hidden>
        <div class="loghead"><span>log</span><span class="grow"></span>
          <button id="copyLog" data-tip="Copy the whole log to the clipboard (e.g. to paste into a bug report).">Copy</button>
          <button id="closeLog" data-tip="Close the log.">×</button></div>
        <pre id="log"></pre>
      </div></div>
  </section>
</main>

<footer>
  <label data-tip="How to highlight the cut layers (set the range with the sliders on the right edge of the views). Outline: draw the outline of every cut piece at the cut height. Outline + dim: also darken the rest of the model so the cut stands out.">cut <select id="hl">
    <option value="outline">outline</option><option value="dim">outline + dim</option><option value="off">no highlight</option>
  </select></label>
  <span id="sliceZ" class="mono" data-tip="Visible height range (above the build plate). Use the sliders on the right edge of the views.">–</span>
  <button id="cutReset" class="small" hidden data-tip="Remove both cuts: show the whole model again.">reset</button>
  <span class="grow"></span>
  <button data-view="iso" data-tip="Reset to the 3/4 view, fitted to the model.">iso</button><button data-view="front" data-tip="Look from the front.">front</button><button data-view="back" data-tip="Look from the back.">back</button>
  <button data-view="left" data-tip="Look from the left.">left</button><button data-view="right" data-tip="Look from the right.">right</button><button data-view="top" data-tip="Look from the top.">top</button>
</footer>

<div id="tip" role="tooltip" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
