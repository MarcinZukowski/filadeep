<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerFun</title>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header>
  <h1>LayerFun</h1>
  <span class="sub">painted 3MF → solid color layers, core, primer, shell</span>
  <span class="grow"></span>
  <button id="copyLink" title="Copy a link with the source URL and all options">Copy link</button>
</header>

<main>
  <section class="panel" id="left">
    <div class="controls">
      <h2>Source</h2>
      <div class="row">
        <input id="srcUrl" type="url" placeholder="https://…/model.3mf (must allow CORS)">
        <button id="loadUrl">Load</button>
      </div>
      <div class="row">
        <label class="file">Open file…<input id="srcFile" type="file" accept=".3mf"></label>
        <span class="hint">or drop a .3mf anywhere</span>
        <a href="#src=/models/testshapes.3mf" id="example" class="hint">test plate</a>
      </div>
      <div id="srcInfo" class="info"></div>
      <div id="srcLegend" class="legend"></div>
    </div>
    <div class="view"><canvas id="cvSrc"></canvas><div class="tag">source</div></div>
  </section>

  <section class="panel" id="right">
    <div class="controls">
      <h2>Output</h2>
      <div class="grid">
        <fieldset>
          <legend>Color depth</legend>
          <label>black <input id="dmin" type="number" step="0.05" min="0.1" value="0.45"> mm</label>
          <label>white <input id="dmax" type="number" step="0.05" min="0.1" value="1.6"> mm</label>
          <label title="per-filament overrides, e.g. 3=0.4,1=1.5">overrides <input id="depths" type="text" placeholder="3=0.4,1=1.5" size="10"></label>
        </fieldset>
        <fieldset>
          <legend><label><input id="coreOn" type="checkbox"> Core (#1)</label></legend>
          <label>filament <select id="coreF" class="fil"></select></label>
          <label>skin <input id="skin" type="number" step="0.1" min="0.2" value="1.2"> mm</label>
          <label><input id="primerOn" type="checkbox"> primer <select id="primerF" class="fil"></select></label>
          <label>primer <input id="pt" type="number" step="0.1" min="0.2" value="0.8"> mm</label>
        </fieldset>
        <fieldset>
          <legend><label><input id="shellOn" type="checkbox"> Shell (#3)</label></legend>
          <label>filament <select id="shellF" class="fil"></select></label>
          <label>thickness <input id="st" type="number" step="0.1" min="0.2" value="1.0"> mm</label>
          <label><input id="kb" type="checkbox"> also cover bottom</label>
        </fieldset>
        <fieldset>
          <legend>Advanced</legend>
          <label>voxel <input id="voxel" type="number" step="0.05" min="0.1" value="0.25"> mm</label>
          <label>objects <input id="obj" type="text" placeholder="name filter" size="10"></label>
        </fieldset>
      </div>
      <div class="row">
        <button id="run" class="primary" disabled>RUN</button>
        <button id="cancel" hidden>Cancel</button>
        <button id="save" disabled>Save 3MF</button>
        <span id="status" class="hint"></span>
      </div>
      <div id="progress" class="progress" hidden><div class="fill"></div><span class="ptext"></span></div>
      <div id="outLegend" class="legend"></div>
      <details id="logBox"><summary>log</summary><pre id="log"></pre></details>
    </div>
    <div class="view"><canvas id="cvOut"></canvas><div class="tag">output</div></div>
  </section>
</main>

<footer>
  <label><input id="sliceOn" type="checkbox"> layer</label>
  <input id="slice" type="range" min="0" max="100" step="0.01" value="100">
  <span id="sliceZ" class="mono">–</span>
  <span class="grow"></span>
  <button data-view="iso">iso</button><button data-view="front">front</button><button data-view="back">back</button>
  <button data-view="left">left</button><button data-view="right">right</button><button data-view="top">top</button>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
